# Runs the same two scripts a developer runs. Not a reimplementation of them: a workflow
# that assembles its own gradle command line drifts from the local gate, and then "green
# on CI" and "green on my machine" stop meaning the same thing.
name: Gates

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/Harken.Android/gradle/wrapper/gradle-wrapper.properties', 'src/Harken.Android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The native build is arm64-v8a only (ADR-0013) and is cross-compiled by the NDK, so
      # it does not need an arm64 runner — but it is the slowest step here by a distance,
      # and it only changes when the vendored whisper.cpp does.
      - name: Cache the CMake build
        uses: actions/cache@v4
        with:
          path: src/Harken.Android/app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('src/Harken.Android/app/src/main/cpp/**') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: chmod the wrapper and the gates
        run: chmod +x src/Harken.Android/gradlew .claude/scripts/*.sh

      - name: check.sh
        run: .claude/scripts/check.sh

      - name: test-fast.sh
        run: .claude/scripts/test-fast.sh

      # The gates print a pass line and nothing else on success. When one fails the report
      # is what says which assertion, so it is kept whatever the outcome.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            src/Harken.Android/app/build/reports/**
            src/Harken.Android/app/build/test-results/**
