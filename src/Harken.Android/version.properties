# The app's version, in one place.
#
# versionName is the string a person reads and the only part anyone edits: bump it when
# releasing. versionCode is NOT written here — it is the commit count, so it rises on
# every commit without anyone remembering to raise it, which is the whole reason
# versionCode exists. versionCodeFallback is only for a build from a source archive with
# no git history, where the count cannot be taken.
versionName=0.1.0
versionCodeFallback=1
