# The one place a dependency version is written.
#
# Two of these are load-bearing and non-obvious, and they were previously facts buried in
# comments in the middle of a dependency block (ARC-021):
#
#   * material3 is pinned ABOVE the Compose BOM on purpose. Read the note on it below
#     before "fixing" it by deleting the version.
#   * room and ksp move together, and ksp moves with kotlin. Bumping one alone breaks the
#     annotation processor rather than the build file.
#
# The ceiling ARC-037 documented here (compileSdk 36 / AGP 8.12) is gone as of ARC-044:
# AGP 9, compileSdk 37, and the androidx train that was waiting on both.
#
# Group names say what moves together. A version with no group of its own is a library
# nothing else is tied to.

[versions]
# AGP 9.4.0: the version this Google Maven mirrors as current on 2026-09-07 (ARC-044).
# Needs Gradle 9.6.0 or higher — Gradle 9.6 removed the internal Problems API AGP 9.0
# through 9.3 called, so the wrapper and this version move together.
agp = "9.4.0"
kotlin = "2.4.10"
# Tracks kotlin. KSP dropped the "<kotlin>-<ksp>" compound version string somewhere
# after 2.3 — a bare KSP release number now, and a mismatch is still a hard failure at
# configuration time.
ksp = "2.3.11"

compose-bom = "2026.08.00"
# Material 3 Expressive (MaterialExpressiveTheme, MotionScheme, ButtonGroup, SplitButton,
# LoadingIndicator) needs material3 1.4 — carried by the BOM itself since 2026.08.00, but
# still declared explicitly rather than trusted to a train that could regress it.
material3 = "1.4.0"

# room-runtime, room-ktx, room-compiler and room-testing are one release. The compiler
# runs through KSP, so it is also what ties `room` to `ksp` above.
room = "2.8.4"
lifecycle = "2.11.0"
activity-compose = "1.13.0"
navigation-compose = "2.10.0"
core-ktx = "1.19.0"
datastore = "1.2.1"
# RoundedPolygon / Morph — the record button's Circle -> Cookie morph and the
# shape-sequence loading indicator are both built on this.
graphics-shapes = "1.1.0"
# retrofit and converter-gson were dropped when R8 was enabled: nothing had imported
# retrofit2 since the app went local-only (ADR-0011), and Gson came in through the
# converter for two fields of JSON that org.json now reads directly — see
# parseNativeSegments. okhttp stays; ModelDownloadManager streams the model with it.
# 5.x (ARC-044): the breaking changes are Kotlin Multiplatform support, callTimeout()'s
# switch to kotlin.time.Duration, and MockWebServer's package rename — this app uses none
# of them. ModelDownloadManager's whole surface is OkHttpClient(), Request.Builder(), and
# newCall().execute().use { }.
okhttp = "5.5.0"

# ktlint's Gradle plugin. The formatter itself is a separate version the plugin resolves;
# this one is the plugin. Pinned here for the same reason everything else is (ARC-021).
ktlint-plugin = "14.2.0"

junit = "4.13.2"
coroutines-test = "1.11.0"
androidx-test-runner = "1.7.0"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Already on the compile classpath through material3 1.4.0, which resolves the whole
# androidx.lifecycle group to 2.9.0. Declared so collectAsStateWithLifecycle is called
# against a dependency this build states rather than one it inherits (ARC-025).
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# Versionless by design: the BOM below decides what these resolve to.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphics-shapes" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Full local mirror of sessions/segments/summaries plus local title+tag overrides.
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# MigrationTestHelper. Instrumented tests only — does not ship in the app APK.
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[bundles]
# What every Compose screen needs. Kept as a bundle so a new module cannot pick up half
# of it and discover the other half at the first red squiggle.
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-material3",
    "compose-material-icons-extended",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# org.jetbrains.kotlin.android is gone (ARC-044): AGP 9's built-in Kotlin support replaces
# it, and applying it alongside AGP 9 is a hard configuration error, not a warning.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
